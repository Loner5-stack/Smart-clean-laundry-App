services:
  - type: web
    name: smart-clean-api
    env: node
    region: frankfurt # Closest available region to Nigeria/Europe
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: FRONTEND_URL
        value: "https://smart-clean.vercel.app" # Update this to your real Vercel URL
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: API_SECRET
        sync: false
